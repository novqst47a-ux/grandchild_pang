# webapp/ 폴더를 그대로 GitHub Pages에 올린다.
#
# 번들러가 없으므로 빌드 단계가 없다. webapp/ 안의 파일이 곧 배포본이다.
# 다만 배포 전에 테스트와 대비 검사는 돌린다. 저시력 대비는 이 앱의 기능 요구사항이라
# 깨진 채로 나가면 안 된다. 의존성이 없어서 npm install도 필요 없다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간 상태로 남으면 곤란하다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 테스트와 대비 검사
        working-directory: webapp
        run: |
          npm test
          npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - id: deployment
        uses: actions/deploy-pages@v4
