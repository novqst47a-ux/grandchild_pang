// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// 웹/Android 소스는 저장소에 유지하고 Gradle 생성물만 OneDrive 밖에 둔다.
def androidBuildRoot = providers.environmentVariable('SONJUPANG_ANDROID_BUILD_ROOT')
        .getOrElse(new File(System.getProperty('user.home'), 'Documents/Dev/grandchild_pang').absolutePath)
def externalBuildDirectory = new File(androidBuildRoot, 'android-build')

layout.buildDirectory.set(new File(externalBuildDirectory, 'root'))
subprojects {
    layout.buildDirectory.set(new File(externalBuildDirectory, project.name))
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete externalBuildDirectory
}
